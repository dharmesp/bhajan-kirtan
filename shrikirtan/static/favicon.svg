<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Main feather gradient: deep teal to vibrant peacock green -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5a5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <!-- Peacock eye spot gradients -->
    <radialGradient id="eyeOuter" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="eyeInner" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c2340;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Feather shaft - dark core -->
  <path d="M 100 25 Q 99 80 100 165" stroke="#064e3b" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Left vane - main body -->
  <path d="M 100 30 Q 70 50 65 85 Q 62 110 68 140 Q 78 165 100 165" 
        fill="url(#mainGrad)" stroke="#064e3b" stroke-width="2" opacity="0.9"/>
  
  <!-- Right vane - main body -->
  <path d="M 100 30 Q 130 50 135 85 Q 138 110 132 140 Q 122 165 100 165" 
        fill="url(#mainGrad)" stroke="#064e3b" stroke-width="2" opacity="0.9"/>
  
  <!-- Left vane highlights - lighter accent -->
  <path d="M 100 35 Q 82 48 78 75 Q 76 95 80 125 Q 87 155 100 165" 
        fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  
  <!-- Right vane highlights - lighter accent -->
  <path d="M 100 35 Q 118 48 122 75 Q 124 95 120 125 Q 113 155 100 165" 
        fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  
  <!-- Fine barbs creating texture (left) -->
  <g stroke="#10b981" stroke-width="1" opacity="0.5">
    <line x1="92" y1="42" x2="75" y2="48"/>
    <line x1="88" y1="60" x2="68" y2="70"/>
    <line x1="85" y1="78" x2="62" y2="92"/>
    <line x1="82" y1="100" x2="60" y2="115"/>
    <line x1="80" y1="125" x2="63" y2="138"/>
    <line x1="82" y1="145" x2="72" y2="158"/>
  </g>
  
  <!-- Fine barbs (right) -->
  <g stroke="#10b981" stroke-width="1" opacity="0.5">
    <line x1="108" y1="42" x2="125" y2="48"/>
    <line x1="112" y1="60" x2="132" y2="70"/>
    <line x1="115" y1="78" x2="138" y2="92"/>
    <line x1="118" y1="100" x2="140" y2="115"/>
    <line x1="120" y1="125" x2="137" y2="138"/>
    <line x1="118" y1="145" x2="128" y2="158"/>
  </g>
  
  <!-- Peacock eye spot - outer golden ring -->
  <circle cx="100" cy="62" r="18" fill="url(#eyeOuter)" stroke="#92400e" stroke-width="1.5" opacity="0.95"/>
  
  <!-- Eye spot - middle ring (teal) -->
  <circle cx="100" cy="62" r="13" fill="#0ea5a5" stroke="none" opacity="0.7"/>
  
  <!-- Eye spot - inner pupil (dark) -->
  <circle cx="100" cy="62" r="8" fill="url(#eyeInner)" stroke="none"/>
  
  <!-- Eye spot - highlight dot -->
  <circle cx="102" cy="59" r="3" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Secondary eye reflections -->
  <circle cx="100" cy="62" r="6" fill="none" stroke="#1e3a8a" stroke-width="0.5" opacity="0.4"/>
</svg>